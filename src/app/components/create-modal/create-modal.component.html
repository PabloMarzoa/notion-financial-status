<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
  <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700/80 rounded-2xl w-full max-w-lg shadow-2xl p-6 text-slate-900 dark:text-slate-100 relative overflow-hidden">
    
    <!-- Glow effects -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-teal-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <div class="flex items-center justify-between pb-4 border-b border-slate-200 dark:border-slate-800">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-400 to-teal-500 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-emerald-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-bold tracking-tight text-slate-900 dark:text-white">Nuevo Movimiento</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400">Añade un ingreso o gasto y guárdalo en Notion</p>
        </div>
      </div>
      <button (click)="closeModal()" class="text-slate-400 hover:text-slate-700 dark:hover:text-white p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Form Body -->
    <div class="py-5 space-y-4 text-sm">
      
      <!-- Concepto / Nombre -->
      <div>
        <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">
          Concepto / Descripción <span class="text-emerald-500 dark:text-emerald-400">*</span>
        </label>
        <input
          type="text"
          [(ngModel)]="name"
          placeholder="p. ej. Cena Restaurante, Gasolina Repsol..."
          class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition text-sm"
        />
      </div>

      <!-- Cantidad e Importe & Tipo -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">
            Cantidad (€) <span class="text-emerald-500 dark:text-emerald-400">*</span>
          </label>
          <input
            type="number"
            step="0.01"
            [(ngModel)]="cantidad"
            placeholder="0.00"
            class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition text-sm"
          />
        </div>

        <div>
          <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">
            Tipo de Movimiento <span class="text-emerald-500 dark:text-emerald-400">*</span>
          </label>
          <select
            [(ngModel)]="tipo"
            class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition text-sm"
          >
            <option *ngFor="let t of types" [value]="t">{{ t }}</option>
          </select>
        </div>
      </div>

      <!-- Categoría y Fecha -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">
            Categoría <span class="text-emerald-500 dark:text-emerald-400">*</span>
          </label>
          <select
            [(ngModel)]="categoria"
            class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition text-sm"
          >
            <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
          </select>
        </div>

        <div>
          <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">
            Fecha <span class="text-emerald-500 dark:text-emerald-400">*</span>
          </label>
          <input
            type="date"
            [(ngModel)]="dateString"
            class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/80 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition text-sm"
          />
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="flex items-center justify-end space-x-3 pt-4 border-t border-slate-200 dark:border-slate-800">
      <button
        (click)="closeModal()"
        class="px-4 py-2 text-xs font-semibold text-slate-700 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-xl transition"
      >
        Cancelar
      </button>
      <button
        (click)="createRecord()"
        [disabled]="!name.trim() || !cantidad || cantidad <= 0 || isSaving()"
        class="px-5 py-2 text-xs font-semibold text-slate-950 bg-gradient-to-r from-emerald-400 to-teal-400 hover:from-emerald-300 hover:to-teal-300 shadow-lg shadow-emerald-500/20 rounded-xl transition disabled:opacity-50 flex items-center space-x-1.5"
      >
        <span *ngIf="isSaving()" class="w-3.5 h-3.5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
        <span>Crear Registro</span>
      </button>
    </div>

  </div>
</div>
