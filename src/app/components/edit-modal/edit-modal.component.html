<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-fade-in">
  <div class="bg-slate-900 border border-slate-700/80 rounded-2xl w-full max-w-lg shadow-2xl p-6 text-slate-100 relative overflow-hidden">
    
    <!-- Glow effects -->
    <div class="absolute -top-24 -right-24 w-48 h-48 bg-cyan-500/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-rose-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Header -->
    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-500 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-cyan-500/20">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-bold tracking-tight text-white">Editar Movimiento</h3>
          <p class="text-xs text-slate-400">Actualiza o elimina este registro de Notion</p>
        </div>
      </div>
      <button (click)="closeModal()" class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Confirmation Banner for Delete -->
    <div
      *ngIf="isConfirmingDelete()"
      class="mt-4 p-4 rounded-xl bg-rose-500/15 border border-rose-500/30 text-rose-200 text-xs flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 animate-fade-in"
    >
      <div class="flex items-center space-x-2">
        <svg class="w-5 h-5 text-rose-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span>¿Seguro que deseas eliminar este movimiento?</span>
      </div>
      <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
        <button
          (click)="cancelDelete()"
          class="px-2.5 py-1 text-slate-300 hover:text-white bg-slate-800 rounded-lg transition"
        >
          Cancelar
        </button>
        <button
          (click)="confirmDelete()"
          [disabled]="isDeleting()"
          class="px-3 py-1 bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-lg shadow-sm transition flex items-center space-x-1"
        >
          <span *ngIf="isDeleting()" class="w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          <span>Sí, eliminar</span>
        </button>
      </div>
    </div>

    <!-- Form Body -->
    <div class="py-5 space-y-4 text-sm">
      
      <!-- Concepto / Nombre -->
      <div>
        <label class="block font-medium text-slate-300 mb-1">
          Concepto / Descripción <span class="text-cyan-400">*</span>
        </label>
        <input
          type="text"
          [(ngModel)]="editName"
          placeholder="p. ej. Compra Mercadona"
          class="w-full px-3.5 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition text-sm"
        />
      </div>

      <!-- Cantidad e Importe & Tipo -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-medium text-slate-300 mb-1">
            Cantidad (€) <span class="text-cyan-400">*</span>
          </label>
          <input
            type="number"
            step="0.01"
            [(ngModel)]="editCantidad"
            placeholder="0.00"
            class="w-full px-3.5 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition text-sm"
          />
        </div>

        <div>
          <label class="block font-medium text-slate-300 mb-1">
            Tipo de Movimiento <span class="text-cyan-400">*</span>
          </label>
          <select
            [(ngModel)]="editTipo"
            class="w-full px-3.5 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition text-sm"
          >
            <option *ngFor="let t of types" [value]="t">{{ t }}</option>
          </select>
        </div>
      </div>

      <!-- Categoría y Fecha -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block font-medium text-slate-300 mb-1">
            Categoría <span class="text-cyan-400">*</span>
          </label>
          <select
            [(ngModel)]="editCategoria"
            class="w-full px-3.5 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition text-sm"
          >
            <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
          </select>
        </div>

        <div>
          <label class="block font-medium text-slate-300 mb-1">
            Fecha <span class="text-cyan-400">*</span>
          </label>
          <input
            type="date"
            [(ngModel)]="editDateString"
            class="w-full px-3.5 py-2.5 bg-slate-800/80 border border-slate-700 rounded-xl text-slate-100 font-mono focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition text-sm"
          />
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="flex items-center justify-between pt-4 border-t border-slate-800">
      <!-- Delete button -->
      <button
        type="button"
        (click)="promptDelete()"
        [disabled]="isConfirmingDelete() || isSaving() || isDeleting()"
        class="px-3.5 py-2 text-xs font-semibold text-rose-400 hover:text-rose-300 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 rounded-xl transition flex items-center space-x-1.5 disabled:opacity-50"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span>Eliminar</span>
      </button>

      <!-- Action buttons -->
      <div class="flex items-center space-x-3">
        <button
          (click)="closeModal()"
          class="px-4 py-2 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-xl transition"
        >
          Cancelar
        </button>
        <button
          (click)="saveChanges()"
          [disabled]="!editName.trim() || isSaving() || isDeleting()"
          class="px-5 py-2 text-xs font-semibold text-slate-950 bg-gradient-to-r from-cyan-400 to-blue-400 hover:from-cyan-300 hover:to-blue-300 shadow-lg shadow-cyan-500/20 rounded-xl transition disabled:opacity-50 flex items-center space-x-1.5"
        >
          <span *ngIf="isSaving()" class="w-3.5 h-3.5 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
          <span>Guardar Cambios</span>
        </button>
      </div>
    </div>

  </div>
</div>
